name: Wrong or missing finding
description: A line in a brief is not what it says, or something public was missed
labels: [finding]
body:
  - type: input
    id: product
    attributes: { label: Product slug }
    validations: { required: true }
  - type: input
    id: run
    attributes: { label: Run id (from the footer line) }
  - type: textarea
    id: line
    attributes: { label: The line, with its receipt }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What it should have said, and the public source that shows it }
